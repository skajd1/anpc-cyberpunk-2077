<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANPC · 대화 테스트</title><link rel="stylesheet" href="/style.css"><script type="module" src="/compare.js"></script></head>
<body class="compare-page"><header><div><span class="brand">ANPC</span><span class="edition">대화 테스트</span></div><a href="/">기존 시제품</a></header>
<main class="comparison-layout">
<aside class="settings-rail"><h1>설정</h1>
<label class="check"><input id="allow-draft" type="checkbox">조사 초안으로 테스트</label>
<section><h2>연결</h2><label for="mode">실행 모드</label><select id="mode"><option value="mock">모의 응답</option><option value="openai">OpenAI API</option><option value="codex">Codex 로그인</option></select>
<div id="provider-settings" hidden><label for="model">모델</label><select id="model"></select><div id="custom-settings" hidden><label for="custom-model">모델 ID</label><input id="custom-model" autocomplete="off"></div></div>
<div id="key-settings" hidden><label for="api-key">API 키</label><input id="api-key" type="password" autocomplete="off"><button id="forget-key">키 지우기</button><p id="key-help" class="hint">키는 메모리에서만 사용합니다.</p></div>
<div id="codex-settings" hidden><button id="refresh-models">모델 목록 조회</button><p id="codex-status" role="status">조회 전</p></div>
<p id="provider-help" class="hint"></p></section>
<details class="settings-advanced"><summary>대화 조건</summary>
<label for="configuration">프롬프트 구성</label><select id="configuration"><option value="card">카드만</option><option value="knowledge">카드 + 지식</option><option value="full" selected>카드 + 지식 + 예시</option></select>
<label for="relationship">가상 관계</label><select id="relationship"><option value="unknown">알 수 없음</option><option value="acquaintance" selected>안면 있음</option><option value="cooperative">협력 중</option></select>
<div id="phase-settings"></div>
<label class="check"><input id="alive" type="checkbox" checked>생존 확인</label>
<label class="check"><input id="free" type="checkbox" checked>자유 대화 가능</label>
<label class="check"><input id="basic-knowledge" type="checkbox" checked>지식 프로필 적용</label>
<label class="check"><input id="relic-known" type="checkbox">렐릭 인지</label>
<label class="check"><input id="relic-disclosed" type="checkbox">렐릭 공개 허용</label>
<p class="hint">게임과 연결되지 않은 가상 조건입니다.</p></details>
<p class="hint">인물·조건 변경 시 대화가 초기화됩니다.</p></aside>
<article class="comparison-workspace" id="dialogue-test"><div class="chat-toolbar"><h2>채팅</h2><div><button id="recontact" type="button">종료</button><button id="reset" type="button">초기화</button></div></div>
<p id="status" class="hint" role="status">조사 초안 사용을 켜고 대화를 시작하세요.</p>
<div id="comparison-results" class="comparison-results" aria-label="대화 내용"></div>
<div id="error" role="alert" hidden></div>
<form id="compare-form"><div class="preset-row"><label for="question-preset">질문 프리셋</label><select id="question-preset"><option value="">질문 선택…</option></select></div><p id="preset-hint" class="hint" hidden></p><label for="input" class="sr-only">선택한 인물에게 보낼 질문</label><textarea id="input" maxlength="1000" rows="2" placeholder="메시지를 입력하세요"></textarea><div class="compose-footer"><span id="request-count"></span><div><button id="cancel" type="button" hidden>취소</button><button id="send" type="submit" class="primary">보내기</button></div></div></form></article>
<aside class="character-rail" id="profile-inspector"><h2>인물 특성</h2><p class="hint">고정 정체성 · 조사 초안</p><div id="character-profile"></div></aside>
</main><footer>게임 미연결 · 모의 응답은 품질 평가용이 아닙니다 · 새로고침하면 대화가 초기화됩니다</footer></body></html>
